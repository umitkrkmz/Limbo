# Builds the end-user package and creates a *draft* GitHub Release whenever a
# version tag is pushed, e.g.:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# The draft gets the installer + portable zip (each with a .sha256 file) attached; edit the release notes and
# press "Publish" on GitHub when ready. Tags with a suffix (v1.2.0-rc.1) become
# pre-releases, which is handy for testing this workflow itself.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Catches the easy mistake of tagging before bumping <Version>, which
      # would ship an exe whose --version disagrees with the release.
      - name: Check tag matches project version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/Limbo.Console/Limbo.Console.csproj
          $version = @($proj.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($env:TAG -ne "v$version" -and -not $env:TAG.StartsWith("v$version-")) {
            throw "Tag $env:TAG does not match <Version>$version</Version> in Limbo.Console.csproj"
          }
          # 1.2.0-rc.1 for names, 1.2.0 for the installer's Windows file version.
          "APP_VERSION=$($env:TAG.Substring(1))" >> $env:GITHUB_ENV
          "APP_NUMERIC_VERSION=$version" >> $env:GITHUB_ENV

      # WinDivert binaries aren't committed to this repo; fetch the official
      # pre-built release so the package ships the real driver. Its license
      # text is committed (src/Limbo.Driver/LICENSE-WinDivert.txt).
      - name: Download official WinDivert 2.2.2
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip" -OutFile windivert.zip
          Expand-Archive -Path windivert.zip -DestinationPath windivert-extracted
          $native = "src/Limbo.Driver/runtimes/win-x64/native"
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          Copy-Item "windivert-extracted/WinDivert-2.2.2-A/x64/WinDivert.dll" "$native/WinDivert.dll"
          Copy-Item "windivert-extracted/WinDivert-2.2.2-A/x64/WinDivert64.sys" "$native/WinDivert64.sys"

      - name: Restore
        run: dotnet restore Limbo.slnx

      - name: Build
        run: dotnet build Limbo.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Limbo.Tests/Limbo.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish (self-contained, single file)
        run: dotnet publish src/Limbo.Console/Limbo.Console.csproj -p:PublishProfile=win-x64

      - name: Verify package contents
        shell: pwsh
        run: |
          $dir = "src/Limbo.Console/bin/publish/win-x64"
          $expected = "Limbo.Console.exe", "WinDivert.dll", "WinDivert64.sys",
                      "LICENSE.txt", "THIRD-PARTY-NOTICES.txt", "LICENSE-WinDivert.txt"
          $missing = $expected | Where-Object { -not (Test-Path "$dir/$_") }
          if ($missing) { throw "Publish output is missing: $($missing -join ', ')" }

      - name: Package portable zip + SHA-256
        shell: pwsh
        run: |
          $name = "Limbo-Console-$env:TAG-win-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item src/Limbo.Console/bin/publish/win-x64/* $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "ZIP_NAME=$name.zip" >> $env:GITHUB_ENV
          "ZIP_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Build installer (Inno Setup) + SHA-256
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DAppNumericVersion=$env:APP_NUMERIC_VERSION" installer/Limbo.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = "Limbo-$env:TAG-setup.exe"
          Move-Item "installer/Output/$setup" $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "$hash  $setup" | Out-File -Encoding ascii "$setup.sha256"
          "SETUP_NAME=$setup" >> $env:GITHUB_ENV
          "SETUP_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          <!-- Draft created by the release workflow: replace this with the release notes (see CHANGELOG.md) before publishing. -->

          ## Install

          - **Recommended:** run ``$env:SETUP_NAME``. Installs to Program Files, adds a Start menu entry, and can be removed from Add/Remove Programs.
          - **Portable:** extract ``$env:ZIP_NAME`` and run ``Limbo.Console.exe``.

          Either way the app asks for Administrator rights itself (WinDivert needs them). No .NET install required; the runtime is bundled. WinDivert and all third-party license notices are included.

          The app is not code-signed: if SmartScreen warns on first launch, choose **More info > Run anyway**. Windows 11's **Smart App Control** blocks unsigned apps entirely; see the README.

          **SHA-256**
          ``````
          $env:SETUP_SHA256  $env:SETUP_NAME
          $env:ZIP_SHA256  $env:ZIP_NAME
          ``````
          "@
          Set-Content -Path release-notes.md -Value $notes

          $files = $env:SETUP_NAME, "$env:SETUP_NAME.sha256", $env:ZIP_NAME, "$env:ZIP_NAME.sha256"
          $flags = @("--draft", "--title", "Limbo $env:TAG", "--notes-file", "release-notes.md")
          if ($env:TAG.Contains("-")) { $flags += "--prerelease" }
          gh release create $env:TAG @files @flags
